name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    name: Backend - Build & Test

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: casksphere_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run full build and verification
      run: mvn clean verify --batch-mode --show-version
      env:
        MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=3

    - name: Upload backend artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: target/casksphere-*.jar
        retention-days: 5

  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend - Build & Verify

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20 (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci --prefer-offline --no-audit

    - name: Lint frontend code
      working-directory: frontend
      run: npm run lint --if-present
      continue-on-error: true

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Verify build output
      working-directory: frontend
      run: |
        if [ ! -d "dist" ]; then
          echo "ERROR: Frontend dist directory not created"
          exit 1
        fi
        echo "✅ Frontend build successful"
        du -sh dist/

    - name: Upload frontend artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 5

  docker-build:
    needs: [backend-verify, frontend-build]
    runs-on: ubuntu-latest
    name: Docker - Build & Verify
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: casksphere:test-build
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify Docker image
      run: |
        docker images | grep casksphere
        echo "✅ Docker image built successfully"

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true

    - name: Build and push to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/casksphere:latest
          ${{ secrets.DOCKER_USERNAME }}/casksphere:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true
