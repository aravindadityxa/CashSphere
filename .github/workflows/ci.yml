name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    name: Backend - Build & Test

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cashsphere
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Wait for MySQL
      run: |
        until mysqladmin ping -h127.0.0.1 -uroot -proot; do
          echo 'waiting for mysql...'
          sleep 1
        done

    - name: Run full build and verification
      run: mvn clean verify --batch-mode --show-version
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/cashsphere
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root
        MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=3

    - name: Upload backend artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: target/cashsphere-*.jar
        retention-days: 5

  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend - Build & Verify

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js 20 (LTS)
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Diagnose npm configuration
      working-directory: frontend
      run: |
        echo "=== npm version ==="
        npm --version
        echo "=== npm registry ==="
        npm config get registry
        echo "=== npm config list ==="
        npm config list
        echo "=== package-lock.json sha512 sample ==="
        head -100 package-lock.json | grep -i "sha512" | head -3

    - name: Install frontend dependencies
      working-directory: frontend
      run: |
        npm config set cache /tmp/npm-cache-clean
        rm -rf /tmp/npm-cache-clean
        mkdir -p /tmp/npm-cache-clean
        npm ci --no-audit --no-fund

    - name: Lint frontend code
      working-directory: frontend
      run: npm run lint --if-present
      continue-on-error: true

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Verify build output
      working-directory: frontend
      run: |
        if [ ! -d "dist" ]; then
          echo "ERROR: Frontend dist directory not created"
          exit 1
        fi
        echo "✅ Frontend build successful"
        du -sh dist/

    - name: Upload frontend artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 5

  docker-build:
    needs: [backend-verify, frontend-build]
    runs-on: ubuntu-latest
    name: Docker - Build & Verify
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: cashsphere:test-build
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify Docker image
      run: |
        docker images | grep cashsphere
        echo "✅ Docker image built successfully"

    - name: Validate docker-compose
      run: docker-compose config > /dev/null

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true

    - name: Build and push to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/cashsphere:latest
          ${{ secrets.DOCKER_USERNAME }}/cashsphere:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true
