version: '3.9'

services:
  mysql:
    image: mysql:8.3
    container_name: cashsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cashsphere
    ports:
      - "3306:3306"
    volumes:
      - cashsphere-data:/var/lib/mysql
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cashsphere-network
    restart: unless-stopped

  cashsphere-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashsphere-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cashsphere
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cashsphere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  cashsphere-data:
    driver: local

networks:
  cashsphere-network:
    driver: bridge
